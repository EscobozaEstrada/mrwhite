version: 1.0
runtime: python311

build:
  commands:
    build:
      - echo "🏗️  Installing system dependencies..."
      - apt-get update && apt-get install -y build-essential libpq-dev curl wkhtmltopdf
      - echo "📦 Installing Python dependencies..."
      - pip install --upgrade pip
      - pip install -r requirements.txt

run:
  command: gunicorn --bind 0.0.0.0:8080 wsgi:application
  network:
    port: 8080
  
  # Environment variables are now passed directly from Terraform to the container
